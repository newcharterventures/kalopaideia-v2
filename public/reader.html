<head>

<meta name="viewport" content="width=device-width, initial-scale=1" />

<!-- Favicons + PWA -->
<link rel="icon" type="image/png" sizes="32x32" href="/paideia/img/favicon-32.png?v=1777151780" />
<link rel="icon" type="image/png" sizes="16x16" href="/paideia/img/favicon-16.png?v=1777151780" />
<link rel="shortcut icon" href="/paideia/img/favicon.ico?v=1777151780" />
<link rel="apple-touch-icon" sizes="180x180" href="/paideia/img/icon-180.png?v=1777151780" />
<link rel="apple-touch-icon" sizes="152x152" href="/paideia/img/icon-152.png?v=1777151780" />
<link rel="apple-touch-icon" sizes="120x120" href="/paideia/img/icon-120.png?v=1777151780" />
<link rel="manifest" href="/paideia/manifest.webmanifest?v=1777151780" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Kalopaideia" />
<meta name="theme-color" content="#1a1410" />
<link rel="stylesheet" href="/paideia/styles.css?v=1777668400" />
</head>
<body>
<header class="masthead">
  <div class="masthead-top">
    <span class="smallcaps"><a href="/paideia/" style="color:inherit">Home</a></span>
    <span class="smallcaps" id="reader-section-label">Reader</span>
    <span class="smallcaps">&nbsp;</span>
  </div>
  <h1 class="title"><a href="/paideia/" aria-label="Kalopaideia home">Kalopaideia</a></h1>
  <div class="subtitle"><em>Legere</em> — to read</div>
  <nav class="nav">
    <a href="/paideia/latin">Latin</a>
    <a href="/paideia/greek">Greek</a>
    <a href="/paideia/french">French</a>
    <a href="/paideia/german">German</a>
    <a href="/paideia/oldenglish">Old English</a>
    <a href="/paideia/about.html">About</a>
  </nav>
</header>
<main class="reader-main">
  <div id="reader-loading" class="center">Opening the book…</div>
  <article id="reader" style="display:none">
    <header class="reader-header">
      <h1 class="reader-title" id="reader-title"></h1>
      <div class="reader-meta">
        <div class="reader-author" id="reader-author"></div>
        <div class="reader-trans" id="reader-trans"></div>
      </div>
      <div class="reader-notes" id="reader-notes"></div>
    </header>

    <div class="reader-crumb" id="section-crumb"></div>

    <div class="reader-mode-tabs">
      <button class="reader-mode-tab active" id="mode-chapters" data-mode="chapters" style="display:none">Chapters</button>
      <button class="reader-mode-tab" data-mode="session">Session (10 lines)</button>
      <button class="reader-mode-tab" data-mode="single">Line by line</button>
    </div>

    <div class="reader-progress">
      <span id="line-current">1</span> / <span id="line-total">0</span>
    </div>

    <div id="reader-body"></div>
  </article>
</main>
<footer class="foot">
  <div class="foot-inner">
    <div class="foot-title">Kalopaideia</div>
    <p class="foot-copyright">
      © 2026 New Charter Ventures &middot; All rights reserved

      &middot; <a href="/paideia/contact.html">Contact</a>

    </p>
  </div>
</footer>
<script type="module" src="/paideia/reader.js?v=1777566229"></script>
</body>
</html>
