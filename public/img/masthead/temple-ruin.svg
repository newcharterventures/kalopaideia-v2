<?xml version="1.0" encoding="UTF-8"?>
<!--
  Temple Ruin — hand-drawn SVG in the spirit of an 18th–19th-century
  archaeological engraving (Stuart & Revett, Dodwell, Piranesi).

  Design notes:
    - Asymmetric ruin: not a clean architectural icon. Pediment broken on
      the right; one column reduced to a stump; one column missing
      entirely; entablature with gaps.
    - Etched-line aesthetic: thin parallel hatching for shadows, fine
      stroke widths, no flat fills except where stone is presented in deep
      shadow.
    - Weathered edges: every contour subtly irregular, suggesting eroded
      limestone; no perfect verticals or horizontals.
    - Foreground fallen drum and a partial column lying on its side, the
      way archaeologists publish their plates.
    - Drawn at 600x320 viewBox; scales cleanly. All strokes use
      currentColor so the host page's --ink (or whatever color) drives it.
    - Stroke widths range from 0.6 (hatch) to 1.6 (heavy contour) to give
      the line variation of a real copperplate engraving.

  No AI generation, no copyrighted reference traced; an original drawing
  in the public-domain antiquarian-engraving style. Per Jae 2026-05-09.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320"
     fill="none" stroke="currentColor"
     stroke-linecap="round" stroke-linejoin="round">

  <!-- ============================================================
       SKY HATCHING (faint, suggests etched ground)
       Sparse parallel diagonal lines across the upper portion.
       ============================================================ -->
  <g stroke-width="0.4" opacity="0.45">
    <line x1="20"  y1="38"  x2="80"  y2="22"/>
    <line x1="60"  y1="56"  x2="140" y2="34"/>
    <line x1="120" y1="42"  x2="220" y2="20"/>
    <line x1="380" y1="18"  x2="490" y2="42"/>
    <line x1="430" y1="32"  x2="540" y2="58"/>
    <line x1="490" y1="22"  x2="580" y2="46"/>
    <line x1="40"  y1="80"  x2="110" y2="68"/>
    <line x1="470" y1="68"  x2="560" y2="86"/>
  </g>

  <!-- ============================================================
       PEDIMENT (broken on the right; left slope intact, right
       slope ends in a jagged break ~70% across)
       ============================================================ -->
  <g stroke-width="1.4">
    <!-- Left slope of pediment -->
    <path d="M 92 144
             L 110 134
             L 168 100
             L 220 73
             L 270 50
             L 304 36
             L 332 32
             L 348 36"/>
    <!-- Top edge — only partial, with a jagged break -->
    <path d="M 348 36
             L 360 40
             L 372 38
             L 386 44"/>
    <!-- Jagged broken edge of pediment (right side) -->
    <path d="M 386 44
             L 392 56
             L 404 50
             L 410 66
             L 418 60
             L 426 78
             L 434 72
             L 440 90"/>
    <!-- Right slope, partial — ends short -->
    <path d="M 440 90
             L 446 102
             L 460 122"/>
  </g>

  <!-- Pediment underside (architrave continuation, with cracks) -->
  <g stroke-width="1.0">
    <path d="M 92 144 L 460 144"/>
    <!-- Crack in the architrave -->
    <path d="M 248 144 L 252 152 L 250 158" stroke-width="0.6" opacity="0.7"/>
    <path d="M 392 144 L 388 156 L 394 162" stroke-width="0.6" opacity="0.7"/>
  </g>

  <!-- Pediment shading (light hatching on the right interior) -->
  <g stroke-width="0.55" opacity="0.6">
    <line x1="240" y1="138" x2="260" y2="118"/>
    <line x1="280" y1="138" x2="305" y2="110"/>
    <line x1="320" y1="138" x2="345" y2="105"/>
    <line x1="360" y1="138" x2="385" y2="105"/>
    <line x1="400" y1="138" x2="420" y2="115"/>
  </g>

  <!-- ============================================================
       FRIEZE (entablature with gaps and worn triglyphs)
       ============================================================ -->
  <g stroke-width="1.0">
    <!-- Top edge of frieze -->
    <path d="M 92 144 L 466 144"/>
    <!-- Bottom edge of frieze, irregular -->
    <path d="M 92 168 L 188 168 L 192 166 L 280 166 L 284 168 L 466 168"/>
  </g>
  <!-- Triglyphs (vertical grooves) — some intact, some weathered out -->
  <g stroke-width="0.7">
    <!-- Bay 1: intact -->
    <line x1="106" y1="150" x2="106" y2="164"/>
    <line x1="110" y1="150" x2="110" y2="164"/>
    <line x1="114" y1="150" x2="114" y2="164"/>
    <!-- Bay 2: half-worn -->
    <line x1="158" y1="150" x2="158" y2="160" opacity="0.5"/>
    <line x1="162" y1="150" x2="162" y2="158" opacity="0.5"/>
    <!-- Bay 3: missing entirely (gap in frieze) -->
    <!-- Bay 4: intact -->
    <line x1="262" y1="150" x2="262" y2="164"/>
    <line x1="266" y1="150" x2="266" y2="164"/>
    <line x1="270" y1="150" x2="270" y2="164"/>
    <!-- Bay 5: half-worn -->
    <line x1="318" y1="150" x2="318" y2="160" opacity="0.55"/>
    <line x1="322" y1="150" x2="322" y2="162" opacity="0.55"/>
    <!-- Bay 6: intact -->
    <line x1="370" y1="150" x2="370" y2="164"/>
    <line x1="374" y1="150" x2="374" y2="164"/>
    <line x1="378" y1="150" x2="378" y2="164"/>
    <!-- Bay 7: missing -->
    <!-- Bay 8: intact -->
    <line x1="436" y1="150" x2="436" y2="164"/>
    <line x1="440" y1="150" x2="440" y2="164"/>
    <line x1="444" y1="150" x2="444" y2="164"/>
  </g>

  <!-- ============================================================
       COLUMNS — 8 originally; some are stumps, one is missing
       ============================================================ -->
  <!--
    Column positions roughly: 100, 148, 196, 244, 292, 340, 388, 436
    Standing intact: 1, 4, 6, 8
    Half-collapsed (drum stack): 2
    Stump only:              5
    Missing entirely:        3
    Cracked but standing:    7
  -->

  <!-- Column 1 (intact, leftmost) — capital, shaft with fluting hatch -->
  <g stroke-width="1.1">
    <!-- Capital -->
    <path d="M 88 168 L 116 168 L 116 174 L 88 174 Z"/>
    <!-- Shaft outline -->
    <path d="M 92 174 L 92 270"/>
    <path d="M 112 174 L 112 270"/>
    <!-- Base -->
    <path d="M 86 270 L 118 270 L 118 276 L 86 276 Z"/>
  </g>
  <!-- Flute lines inside column 1 -->
  <g stroke-width="0.5" opacity="0.7">
    <line x1="96"  y1="180" x2="96"  y2="266"/>
    <line x1="100" y1="180" x2="100" y2="266"/>
    <line x1="104" y1="180" x2="104" y2="266"/>
    <line x1="108" y1="180" x2="108" y2="266"/>
  </g>
  <!-- Right-side shadow hatching on column 1 -->
  <g stroke-width="0.4" opacity="0.55">
    <line x1="113" y1="180" x2="115" y2="180"/>
    <line x1="113" y1="186" x2="115" y2="186"/>
    <line x1="113" y1="192" x2="115" y2="192"/>
    <line x1="113" y1="198" x2="115" y2="198"/>
    <line x1="113" y1="204" x2="115" y2="204"/>
    <line x1="113" y1="210" x2="115" y2="210"/>
    <line x1="113" y1="216" x2="115" y2="216"/>
    <line x1="113" y1="222" x2="115" y2="222"/>
    <line x1="113" y1="228" x2="115" y2="228"/>
    <line x1="113" y1="234" x2="115" y2="234"/>
    <line x1="113" y1="240" x2="115" y2="240"/>
    <line x1="113" y1="246" x2="115" y2="246"/>
    <line x1="113" y1="252" x2="115" y2="252"/>
    <line x1="113" y1="258" x2="115" y2="258"/>
  </g>

  <!-- Column 2 (half-collapsed: drums visible as horizontal joints, one drum missing near top) -->
  <g stroke-width="1.0">
    <!-- Capital fragment, partly broken -->
    <path d="M 138 174 L 158 174"/>
    <path d="M 138 174 L 138 178"/>
    <path d="M 158 174 L 158 180"/>
    <!-- Topmost drum, irregular top edge -->
    <path d="M 140 178 L 156 178"/>
    <!-- Drum joints (horizontal lines across the shaft) -->
    <path d="M 140 178 L 140 198"/>
    <path d="M 158 180 L 158 198"/>
    <path d="M 138 198 L 158 198"/>
    <!-- Gap (missing drum) — interrupted lines -->
    <path d="M 138 218 L 158 218"/>
    <path d="M 140 218 L 140 250"/>
    <path d="M 158 218 L 158 250"/>
    <path d="M 138 230 L 158 230" stroke-width="0.5" opacity="0.6"/>
    <path d="M 138 250 L 158 250"/>
    <!-- Lower drum -->
    <path d="M 140 250 L 140 270"/>
    <path d="M 158 250 L 158 270"/>
    <!-- Base -->
    <path d="M 134 270 L 162 270 L 162 276 L 134 276 Z"/>
  </g>
  <g stroke-width="0.5" opacity="0.7">
    <line x1="144" y1="200" x2="144" y2="216"/>
    <line x1="148" y1="200" x2="148" y2="216"/>
    <line x1="152" y1="200" x2="152" y2="216"/>
    <line x1="144" y1="232" x2="144" y2="248"/>
    <line x1="148" y1="232" x2="148" y2="248"/>
    <line x1="152" y1="232" x2="152" y2="248"/>
    <line x1="144" y1="252" x2="144" y2="266"/>
    <line x1="148" y1="252" x2="148" y2="266"/>
    <line x1="152" y1="252" x2="152" y2="266"/>
  </g>

  <!-- Column 3 — MISSING ENTIRELY. Only a residue on the stylobate. -->
  <g stroke-width="0.6" opacity="0.7">
    <path d="M 188 270 L 204 270"/>
    <path d="M 184 273 L 208 273"/>
  </g>

  <!-- Column 4 (intact) -->
  <g stroke-width="1.1">
    <path d="M 232 168 L 260 168 L 260 174 L 232 174 Z"/>
    <path d="M 236 174 L 236 270"/>
    <path d="M 256 174 L 256 270"/>
    <path d="M 230 270 L 262 270 L 262 276 L 230 276 Z"/>
  </g>
  <g stroke-width="0.5" opacity="0.7">
    <line x1="240" y1="180" x2="240" y2="266"/>
    <line x1="244" y1="180" x2="244" y2="266"/>
    <line x1="248" y1="180" x2="248" y2="266"/>
    <line x1="252" y1="180" x2="252" y2="266"/>
  </g>
  <g stroke-width="0.4" opacity="0.55">
    <line x1="257" y1="180" x2="259" y2="180"/>
    <line x1="257" y1="190" x2="259" y2="190"/>
    <line x1="257" y1="200" x2="259" y2="200"/>
    <line x1="257" y1="210" x2="259" y2="210"/>
    <line x1="257" y1="220" x2="259" y2="220"/>
    <line x1="257" y1="230" x2="259" y2="230"/>
    <line x1="257" y1="240" x2="259" y2="240"/>
    <line x1="257" y1="250" x2="259" y2="250"/>
    <line x1="257" y1="260" x2="259" y2="260"/>
  </g>

  <!-- Column 5 — STUMP ONLY (broken at ~mid-height) -->
  <g stroke-width="1.0">
    <!-- Just the lower portion -->
    <path d="M 284 232 L 284 270"/>
    <path d="M 304 232 L 304 270"/>
    <!-- Jagged broken top -->
    <path d="M 282 232 L 286 228 L 290 234 L 294 230 L 298 234 L 302 228 L 306 232"/>
    <!-- Base -->
    <path d="M 278 270 L 310 270 L 310 276 L 278 276 Z"/>
  </g>
  <g stroke-width="0.5" opacity="0.7">
    <line x1="288" y1="238" x2="288" y2="266"/>
    <line x1="292" y1="238" x2="292" y2="266"/>
    <line x1="296" y1="238" x2="296" y2="266"/>
    <line x1="300" y1="238" x2="300" y2="266"/>
  </g>

  <!-- Column 6 (intact) -->
  <g stroke-width="1.1">
    <path d="M 328 168 L 356 168 L 356 174 L 328 174 Z"/>
    <path d="M 332 174 L 332 270"/>
    <path d="M 352 174 L 352 270"/>
    <path d="M 326 270 L 358 270 L 358 276 L 326 276 Z"/>
  </g>
  <g stroke-width="0.5" opacity="0.7">
    <line x1="336" y1="180" x2="336" y2="266"/>
    <line x1="340" y1="180" x2="340" y2="266"/>
    <line x1="344" y1="180" x2="344" y2="266"/>
    <line x1="348" y1="180" x2="348" y2="266"/>
  </g>
  <g stroke-width="0.4" opacity="0.55">
    <line x1="353" y1="180" x2="355" y2="180"/>
    <line x1="353" y1="190" x2="355" y2="190"/>
    <line x1="353" y1="200" x2="355" y2="200"/>
    <line x1="353" y1="210" x2="355" y2="210"/>
    <line x1="353" y1="220" x2="355" y2="220"/>
    <line x1="353" y1="230" x2="355" y2="230"/>
    <line x1="353" y1="240" x2="355" y2="240"/>
    <line x1="353" y1="250" x2="355" y2="250"/>
    <line x1="353" y1="260" x2="355" y2="260"/>
  </g>

  <!-- Column 7 (cracked, lean slightly) -->
  <g stroke-width="1.0">
    <path d="M 376 168 L 404 168 L 404 174 L 376 174 Z"/>
    <!-- Slightly leaning shaft -->
    <path d="M 380 174 L 378 270"/>
    <path d="M 400 174 L 402 270"/>
    <!-- Crack across the shaft -->
    <path d="M 378 215 L 384 218 L 392 213 L 398 218 L 402 215" stroke-width="0.5"/>
    <path d="M 374 270 L 406 270 L 406 276 L 374 276 Z"/>
  </g>
  <g stroke-width="0.5" opacity="0.65">
    <line x1="384" y1="180" x2="383" y2="266"/>
    <line x1="388" y1="180" x2="388" y2="266"/>
    <line x1="392" y1="180" x2="393" y2="266"/>
    <line x1="396" y1="180" x2="397" y2="266"/>
  </g>

  <!-- Column 8 (intact, rightmost) — slightly more weathered top -->
  <g stroke-width="1.1">
    <path d="M 424 168 L 452 168 L 452 174 L 424 174 Z"/>
    <path d="M 428 174 L 428 270"/>
    <path d="M 448 174 L 448 270"/>
    <path d="M 422 270 L 454 270 L 454 276 L 422 276 Z"/>
  </g>
  <g stroke-width="0.5" opacity="0.7">
    <line x1="432" y1="180" x2="432" y2="266"/>
    <line x1="436" y1="180" x2="436" y2="266"/>
    <line x1="440" y1="180" x2="440" y2="266"/>
    <line x1="444" y1="180" x2="444" y2="266"/>
  </g>
  <g stroke-width="0.4" opacity="0.55">
    <line x1="449" y1="180" x2="451" y2="180"/>
    <line x1="449" y1="190" x2="451" y2="190"/>
    <line x1="449" y1="200" x2="451" y2="200"/>
    <line x1="449" y1="210" x2="451" y2="210"/>
    <line x1="449" y1="220" x2="451" y2="220"/>
    <line x1="449" y1="230" x2="451" y2="230"/>
    <line x1="449" y1="240" x2="451" y2="240"/>
    <line x1="449" y1="250" x2="451" y2="250"/>
    <line x1="449" y1="260" x2="451" y2="260"/>
  </g>

  <!-- ============================================================
       STYLOBATE (3 steps, irregular weathered edges)
       ============================================================ -->
  <g stroke-width="1.0">
    <!-- Top step -->
    <path d="M 80 276 L 462 276"/>
    <path d="M 80 276 L 78 282 L 462 282 L 460 276"/>
    <!-- Middle step -->
    <path d="M 70 282 L 472 282"/>
    <path d="M 70 282 L 68 290 L 472 290 L 472 282"/>
    <!-- Lowest step -->
    <path d="M 60 290 L 480 290"/>
    <path d="M 60 290 L 60 298 L 480 298 L 480 290"/>
    <!-- Some weathering (small notches and cracks in steps) -->
    <path d="M 142 282 L 146 285 L 150 282" stroke-width="0.5" opacity="0.6"/>
    <path d="M 230 290 L 234 293 L 238 290" stroke-width="0.5" opacity="0.6"/>
    <path d="M 348 282 L 352 285 L 356 282" stroke-width="0.5" opacity="0.6"/>
  </g>

  <!-- Step shading (subtle hatch under each step's overhang) -->
  <g stroke-width="0.4" opacity="0.5">
    <line x1="86"  y1="280" x2="90"  y2="280"/>
    <line x1="100" y1="280" x2="104" y2="280"/>
    <line x1="120" y1="280" x2="124" y2="280"/>
    <line x1="160" y1="280" x2="164" y2="280"/>
    <line x1="200" y1="280" x2="204" y2="280"/>
    <line x1="260" y1="280" x2="264" y2="280"/>
    <line x1="320" y1="280" x2="324" y2="280"/>
    <line x1="380" y1="280" x2="384" y2="280"/>
    <line x1="430" y1="280" x2="434" y2="280"/>
  </g>

  <!-- ============================================================
       FOREGROUND — fallen architectural fragments
       (a column drum on its side, a fragment of capital, vegetation hint)
       ============================================================ -->

  <!-- Fallen column drum (cylindrical, on its side, foreground left) -->
  <g stroke-width="1.0">
    <!-- Drum outline -->
    <path d="M 122 308
             C 122 304, 130 302, 144 302
             L 184 302
             C 196 302, 200 304, 200 308
             C 200 312, 196 314, 184 314
             L 144 314
             C 130 314, 122 312, 122 308 Z"/>
    <!-- Joint groove (front face of drum) -->
    <ellipse cx="122" cy="308" rx="3" ry="6" stroke-width="0.7"/>
    <!-- Far end suggestion -->
    <path d="M 198 304 L 200 308 L 198 312" stroke-width="0.5" opacity="0.7"/>
  </g>
  <!-- Drum top hatch shading -->
  <g stroke-width="0.4" opacity="0.5">
    <line x1="138" y1="305" x2="142" y2="304"/>
    <line x1="148" y1="305" x2="152" y2="304"/>
    <line x1="158" y1="305" x2="162" y2="304"/>
    <line x1="168" y1="305" x2="172" y2="304"/>
    <line x1="178" y1="305" x2="182" y2="304"/>
  </g>

  <!-- Capital fragment (lying separate, foreground right) -->
  <g stroke-width="0.9">
    <!-- Tipped capital, rectangular -->
    <path d="M 396 312
             L 444 314
             L 446 308
             L 432 304
             L 396 306 Z"/>
    <!-- Volute scroll (Ionic capital hint, even though Doric — the broken piece) -->
    <path d="M 410 308 C 408 308, 406 310, 408 312 C 412 313, 414 309, 410 308 Z" stroke-width="0.6"/>
    <path d="M 432 308 C 430 308, 428 310, 430 312 C 434 313, 436 309, 432 308 Z" stroke-width="0.6"/>
  </g>

  <!-- Small ground-line tussocks of grass (vegetation suggestion) -->
  <g stroke-width="0.6" opacity="0.7">
    <path d="M 230 312 L 232 308 L 234 312"/>
    <path d="M 234 312 L 236 309 L 238 312"/>
    <path d="M 280 314 L 282 311 L 284 314"/>
    <path d="M 284 314 L 286 310 L 288 314"/>
    <path d="M 350 312 L 352 308 L 354 312"/>
    <path d="M 354 312 L 356 309 L 358 312"/>
  </g>

  <!-- Distant ground line (the horizon below the temple, faint) -->
  <g stroke-width="0.6" opacity="0.55">
    <path d="M 30 300 L 60 298"/>
    <path d="M 480 298 L 540 302"/>
  </g>

</svg>
